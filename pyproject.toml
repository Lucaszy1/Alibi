[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alibi"
version = "0.1.0"
description = "Judges whether endpoint-security alerts from AI coding agents were justified by the user's request."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
alibi = "alibi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/alibi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
