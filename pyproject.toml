[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alibi"
version = "0.1.0"
description = "Judges whether endpoint-security alerts from AI coding agents were justified by the user's request."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/alibi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
