[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alibi-guard"
version = "1.0.0"
description = "Judges whether endpoint-security alerts from AI coding agents were justified by the user's request."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luca Szyszkowski" }]
keywords = ["security", "ai-agents", "prompt-injection", "provenance", "edr", "llm-security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Repository = "https://github.com/Lucaszy1/Alibi"

[project.scripts]
alibi = "alibi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/alibi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
